<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14110e">
<link rel="apple-touch-icon" href="icon-192.png">
<title>解禁の畑 — Tier 4</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:#14110e;color:#e8e0d4;
    font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  #app{max-width:480px;margin:0 auto;padding:0 12px 96px}
  h1{font-size:15px;letter-spacing:.08em;margin:14px 2px 10px;color:#c9a227;font-weight:700}
  h1 small{color:#6f655a;font-weight:400;letter-spacing:0;margin-left:6px}
  h2{font-size:12px;letter-spacing:.1em;color:#8d8275;margin:18px 2px 8px;font-weight:700}

  .inv{display:flex;gap:6px;overflow-x:auto;padding:8px 2px;scrollbar-width:none}
  .inv::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;background:#201b16;border:1px solid #2e2720;border-radius:10px;
        padding:6px 10px;font-size:13px;white-space:nowrap}
  .chip.st{border-color:#4a3f28}
  .chip b{font-variant-numeric:tabular-nums}
  .chip.full{border-color:#c4604a;color:#c4604a}
  .chip .cp{color:#6f655a;font-size:11px}
  .inv .empty{color:#6f655a;font-size:13px;padding:6px 2px}

  .card{background:#201b16;border:1px solid #2e2720;border-radius:14px;padding:12px;margin-bottom:10px}
  .card.run{border-color:#4a3f28;background:#241d14}
  .card[onclick]{cursor:pointer}
  .card[onclick]:active{border-color:#6b5c3a}
  .chev{color:#6f655a;font-size:22px;width:16px}
  .subtabs{display:flex;gap:6px;margin:0 2px 10px}
  .subtabs button{flex:1 1 0;min-width:0;background:#201b16;border:1px solid #2e2720;
    color:#8d8275;padding:10px 4px;font-size:13px;border-radius:10px;font-weight:600;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    font-variant-numeric:tabular-nums}
  .subtabs button.on{background:#2e2720;color:#e8e0d4;border-color:#4a3f28}
  .subtabs .badge{display:inline-block;margin-left:5px;background:#c9a227;color:#14110e;
    border-radius:8px;padding:0 6px;font-size:11px;font-weight:700;vertical-align:1px}
  .row{display:flex;align-items:center;gap:10px}
  .ico{font-size:26px;width:34px;text-align:center;flex:0 0 auto}
  .name{font-weight:600}
  .sub{color:#8d8275;font-size:12.5px;margin-top:2px}
  .grow{flex:1;min-width:0}

  button{font:inherit;font-weight:600;border:none;border-radius:10px;padding:9px 14px;
    background:#6b8f3f;color:#0f0d0b;cursor:pointer;flex:0 0 auto}
  button:disabled{background:#2a241e;color:#6f655a}
  button.alt{background:#c9a227}
  button.ghost{background:transparent;border:1px solid #3a322a;color:#a89c8c;font-weight:500}
  /* 押せないボタンは必ず沈んで見せる。上の button:disabled だけだと
     後から来る button.alt に同じ詳細度で負け、金色のまま残っていた */
  button:disabled,button.alt:disabled,button.ghost:disabled{
    background:#2a241e;color:#6f655a;border-color:#2a241e;cursor:default}

  .bar{height:4px;background:#2a241e;border-radius:3px;margin-top:9px;overflow:hidden}
  .bar i{display:block;height:100%;background:#6b8f3f;border-radius:3px}
  .bar.gold i{background:#c9a227}

  .plots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .plot{background:#201b16;border:1px solid #2e2720;border-radius:12px;padding:10px 6px;text-align:center}
  .plot .pi{font-size:24px;line-height:1.3}
  .plot .pt{font-size:11px;color:#8d8275;font-variant-numeric:tabular-nums;min-height:15px}
  .plot button{width:100%;padding:6px 0;font-size:12.5px;margin-top:6px}
  .plot .pt.good{color:#6b8f3f}
  .plot .pf{font-size:11px;color:#8d8275;margin-top:6px;min-height:15px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .plot[onclick]{cursor:pointer}
  .plot.run{border-color:#4a3f28;background:#241d14}
  .plot .seeds{display:flex;gap:4px;margin-top:6px}
  .plot .seeds button{flex:1 1 0;width:auto;min-width:0;margin-top:0;padding:5px 0;
    font-size:15px;background:#2a241e;border-color:#3a322a;color:#e8e0d4}

  .locked{opacity:.75}
  .q{color:#6f655a;font-weight:700;letter-spacing:.1em}
  .hint{color:#8d8275;font-size:12.5px;margin-top:2px;font-style:italic}
  .tag{display:inline-block;font-size:11px;border:1px solid #3a322a;color:#8d8275;
       border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:1px}
  .tag.s{color:#c9a227;border-color:#4a3f28}
  .tag.t{color:#7fa3c4;border-color:#2f4454}
  .cost{font-size:12.5px;color:#8d8275;margin-top:4px}
  .cost .no{color:#c4604a}
  .need{font-size:12px;color:#c4604a;margin-top:3px}
  .slotline{font-size:12px;color:#6f655a;margin-top:3px;font-variant-numeric:tabular-nums}
  .slotline.no{color:#c4604a}
  .mod{font-size:12px;color:#7fa3c4;margin-top:3px}

  .tr{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #2a241e}
  .tr:last-child{border-bottom:none}
  .tr .tl{flex:1;min-width:0;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tr .tu{color:#6f655a;font-size:11.5px;flex:0 0 auto}
  input[type=number]{width:58px;flex:0 0 auto;background:#14110e;border:1px solid #3a322a;
    color:#e8e0d4;border-radius:8px;padding:7px 8px;font:inherit;font-size:14px;
    text-align:right;font-variant-numeric:tabular-nums}
  input[type=number]:focus{outline:none;border-color:#c9a227}
  .savebox{width:100%;height:68px;background:#14110e;border:1px solid #3a322a;
    color:#8d8275;border-radius:8px;padding:8px;font:inherit;font-size:11px;
    resize:vertical;-webkit-appearance:none}
  .savebox:focus{outline:none;border-color:#c9a227}
  .ladder{font-variant-numeric:tabular-nums;font-size:13.5px}
  .ladder div{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid #2a241e}
  .ladder div:last-child{border-bottom:none}
  .ladder .lt{color:#c9a227;width:64px;flex:0 0 auto;text-align:right;font-weight:600}
  .ladder .ld{color:#6f655a;width:52px;flex:0 0 auto;text-align:right}
  .warn{color:#c4604a}
  .good{color:#6b8f3f}

  nav{position:fixed;bottom:0;left:0;right:0;background:#1a1612;border-top:1px solid #2e2720;
      display:flex;padding:6px 0 10px;z-index:5}
  nav button{flex:1;background:none;color:#6f655a;font-size:11.5px;font-weight:600;padding:6px 0;border-radius:0}
  nav button.on{color:#c9a227}
  nav button .nv{display:block;font-size:19px;line-height:1.2;filter:grayscale(1) opacity(.5)}
  nav button.on .nv{filter:none}

  #toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:9;
         display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
  #toast div{background:#2e2720;border:1px solid #42392f;font-size:13px;
             padding:7px 14px;border-radius:999px;animation:pop .25s ease}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}}
  .dev{display:flex;align-items:center;gap:8px;margin:14px 2px 0;color:#6f655a;font-size:12px}
  .dev button{padding:5px 10px;font-size:12px}
</style>
</head>
<body>
<div id="app">
  <h1>解禁の畑 <small>Tier 4</small></h1>
  <div class="inv" id="inv"></div>
  <div id="view"></div>
</div>
<nav id="nav"></nav>
<div id="toast"></div>

<script>
/* ============================================================

   mods     : 持っているだけで効く補正。mul=倍率 add=加算
   ============================================================ */
const ITEMS={

  log:   {name:'丸太',  icon:'🪵',kind:'material'},
  plank: {name:'板材',  icon:'🟫',kind:'material'},
  wheat: {name:'麦',    icon:'🌾',kind:'material',cat:'food'},
  flour: {name:'小麦粉',icon:'🏺',kind:'material'},
  sawdust:{name:'木くず',icon:'🟨',kind:'material'},
  dung:   {name:'厩肥',  icon:'💩',kind:'material'},

  /* ---- Tier 4 の素材 ---- */

  cobweb: {name:'クモの巣',icon:'🕸',kind:'material'},
  cuore:  {name:'銅鉱石',  icon:'🔶',kind:'material'},
  copper: {name:'銅',      icon:'🟠',kind:'material'},
  thread: {name:'糸',      icon:'🧵',kind:'material'},

  milk:   {name:'乳',      icon:'🥛',kind:'material',cat:'food'},

  /* ---- 料理 ---- */
  cheese: {name:'チーズ',      icon:'🧀',kind:'material',cat:'food'},
  jerky:  {name:'干し肉',      icon:'🥓',kind:'material',cat:'food'},
  soup:   {name:'野菜スープ',  icon:'🍲',kind:'material',cat:'food'},
  pie:    {name:'木の実のパイ',icon:'🥧',kind:'material',cat:'food'},
  grilled:{name:'焼き魚',      icon:'🍢',kind:'material',cat:'food'},
  cornbread:{name:'コーンブレッド',icon:'🫓',kind:'material',cat:'food'},

  /* ---- 集落 ---- */
  fame:  {name:'評判',      icon:'🎖',kind:'material'},
  steel: {name:'鋼',        icon:'🔗',kind:'material'},
  cseed: {name:'珍しい種',  icon:'🌰',kind:'material'},

  ore:   {name:'鉱石',  icon:'🧱',kind:'material'},

  /* ---- Tier 3 の素材 ---- */
  sand:    {name:'砂',    icon:'🏜',kind:'material'},
  water:   {name:'水',    icon:'💧',kind:'material'},
  charcoal:{name:'木炭',  icon:'⬛',kind:'material'},
  glass:   {name:'ガラス',icon:'🫙',kind:'material'},
  clay:    {name:'粘土',  icon:'🟤',kind:'material'},
  brick:   {name:'レンガ',icon:'🟧',kind:'material'},

  workbench:{name:'作業台',  icon:'🛠', kind:'station'},
  mill:     {name:'粉引き機',icon:'⚙️',kind:'station'},
  furnace:  {name:'炉',      icon:'🔥',kind:'station'},
  farm:     {name:'畑',      icon:'🟩',kind:'plot'},

  bellows:  {name:'ふいご',  icon:'💨',kind:'material'},
  firebrick:{name:'耐火レンガ',icon:'🟥',kind:'material'},
  compost:  {name:'堆肥箱',  icon:'♻',kind:'station'},
  pantry:   {name:'保存食棚',icon:'🍱',kind:'station',
             caps:[{cat:'food',add:60}]},
  loom:     {name:'織機',    icon:'🪡',kind:'station'},
  kitchen:  {name:'調理場',  icon:'🍳',kind:'station'},

     並列数はその動物を何匹飼っているかになる */
  chicken:  {name:'鶏',      icon:'🐔',kind:'station'},
  goat:     {name:'山羊',    icon:'🐐',kind:'station'},

  /* 住民。顔を覚えてもらうと、その人だけが扱う物を回してくれる。
     station として持つことで「その人に頼める」を表す */
  trader:   {name:'行商人',  icon:'🛍',kind:'villager'},
  smith:    {name:'鍛冶屋',  icon:'🔨',kind:'villager'},
  herbalist:{name:'薬師',    icon:'🧪',kind:'villager'},

  stone_axe:{name:'石の斧',    icon:'🪓',kind:'tool'},
  pickaxe:  {name:'石のツルハシ',icon:'⛏',kind:'tool'},
  iron_axe: {name:'鉄の斧',    icon:'⚒',kind:'tool',
             mods:[{k:'cd.log',mul:0.5}]},
  shovel:   {name:'木のシャベル',icon:'🥄',kind:'tool'},
  bucket:   {name:'木のバケツ',  icon:'🪣',kind:'tool'},
  lantern:  {name:'ランタン',    icon:'🏮',kind:'tool',
             mods:[{k:'cd.ore',mul:0.7},{k:'cd.stone',mul:0.8}]},
  rod:      {name:'釣竿',        icon:'🎣',kind:'tool'},
  rod2:     {name:'丈夫な釣竿',  icon:'🪝',kind:'tool'},

  boat:     {name:'小舟',        icon:'🛶',kind:'tool'},
  steeltool:{name:'鋼の道具一式',icon:'🧰',kind:'tool',
             mods:[{k:'cd.ore',mul:0.6},{k:'cd.log',mul:0.8},
                   {k:'cd.stone',mul:0.8},{k:'cd.boulder',mul:0.8}]},
  charm:    {name:'守り袋',      icon:'🧿',kind:'tool',
             mods:[{k:'grow.wheat',mul:0.9},{k:'grow.potato',mul:0.9},
                   {k:'grow.corn',mul:0.9}]},

/* エリア。解禁は got: 条件で見る（材料として消える物を have: で見ると、
   使い切った瞬間に行けなくなってしまうため） */
const AREAS=[
  {id:'home',   name:'庭',  icon:'🏡',unlock:'start',          hint:''},
  {id:'forest', name:'森',  icon:'🌲',unlock:'got:stone_axe',  hint:'斧があれば、奥へ入れそうだ'},
  {id:'cave',   name:'洞窟',icon:'🕳',unlock:'got:pickaxe',    hint:'固い岩を砕く物があれば'},
  {id:'mount',  name:'山',  icon:'⛰',unlock:'got:rope',       hint:'崖を登る物があれば'},
  {id:'village',name:'集落',icon:'🏘',unlock:'got:cart',       hint:'荷を運ぶ物があれば通えそうだ'},
  {id:'sea',    name:'海',  icon:'🌊',unlock:'got:boat',       hint:'水に浮かぶ物があれば'},
];

const NODES=[
  {id:'branch',name:'低木', icon:'🌳',cd:30, area:'home',  requires:null,
   yield:{branch:[2,3]},desc:'素手で枝を折る'},
  {id:'stone', name:'石ころ',icon:'⛰', cd:45, area:'home',  requires:null,
   yield:{stone:[1,2]}, desc:'地面から拾う'},
  {id:'sand',  name:'砂地', icon:'🏖',cd:60, area:'home',  requires:'have:shovel',
   yield:{sand:[2,3]},  desc:'シャベルで掘り返す'},
  {id:'boulder',name:'大きな石',icon:'🪨',cd:100,area:'home',requires:'have:pickaxe',
   yield:{stone:[3,5]}, desc:'ツルハシがあれば割って運び出せる'},

  {id:'log',   name:'大木', icon:'🌲',cd:120,area:'forest',requires:'have:stone_axe',
   yield:{log:[2,3]},   desc:'斧を持っていないと歯が立たない'},
  {id:'bush',  name:'茂み', icon:'🌿',cd:90, area:'forest',requires:null,
   yield:{berry:[2,3]}, desc:'低い枝に実がついている'},
  {id:'pond',  name:'池',   icon:'🪷',cd:110,area:'forest',requires:'have:rod',
   yield:{riverfish:[1,2]},desc:'木漏れ日の下に小さな淵がある'},
  {id:'spring',name:'泉',   icon:'⛲',cd:90, area:'forest',requires:'have:bucket',
   yield:{water:[1,2]}, desc:'桶で水を汲む'},

  {id:'ore',   name:'鉱脈', icon:'🗻',cd:180,area:'cave',  requires:'have:pickaxe',
   yield:{ore:[2,3]},   desc:'ツルハシで削り出す'},
  {id:'web',   name:'巣穴', icon:'🕸',cd:100,area:'cave',  requires:'have:lantern',
   yield:{cobweb:[3,5]},desc:'灯りがないと奥は見えない'},
  {id:'cuvein',name:'銅脈', icon:'🔶',cd:200,area:'cave',  requires:'have:lantern',
   yield:{cuore:[1,2]}, desc:'赤みがかった筋を削る'},
  {id:'cavelake',name:'地底湖',icon:'💠',cd:200,area:'cave',requires:'have:rod2',
   yield:{cavefish:[1,2]},desc:'灯りの届かない水面で、何かが跳ねた'},

  {id:'herbfield',name:'薬草地',icon:'🍃',cd:110,area:'mount',requires:null,
   yield:{herb:[2,3]},  desc:'斜面に香りの強い草が生える'},
  {id:'stream',name:'川',   icon:'🏞',cd:120,area:'mount', requires:'have:rod',
   yield:{riverfish:[2,3]},desc:'雪どけの水が流れ込んでいる'},

  {id:'fishing',name:'漁場',icon:'🐟',cd:140,area:'sea',   requires:'have:rod2',
   yield:{fish:[1,2]},  desc:'沖に糸を垂らす'},
  {id:'saltpan',name:'塩田',icon:'🧂',cd:120,area:'sea',   requires:null,
   yield:{salt:[1,2]},  desc:'海水を干して採る'},
];

/* station : 1つ以上持っていれば作れる。消費されない
   time    : 秒。入れると「投入して待つ」加工になる（並列数＝設備の個数） */
/* 収納箱は置ける数に限りがある。石蔵を建てると枠が開く。
   RECIPES の中で参照するので、ここで先に宣言しておく */
const CRATE_BASE=4, CRATE_PER_VAULT=4;

const RECIPES=[
  {id:'workbench',out:{workbench:1},inputs:{branch:4,stone:2},station:null,
   unlock:['start'],reveal:['start'],hint:'拾った物を組み合わせる台'},
  {id:'stone_axe',out:{stone_axe:1},inputs:{branch:6,stone:3},station:['workbench'],
   unlock:['got:workbench'],reveal:['start'],hint:'枝と石でできる、何か'},
  {id:'plank',out:{plank:2},inputs:{log:1},station:['workbench'],
   unlock:['got:stone_axe'],reveal:['got:workbench'],hint:'丸太を割ると2つ取れる物'},
  {id:'farm',out:{farm:1},inputs:{plank:4,stone:3},station:['workbench'],
   unlock:['got:plank'],reveal:['got:stone_axe'],hint:'板材×4 と 石×3'},
  {id:'crate',out:{crate:1},inputs:{plank:4,branch:2},station:['workbench'],
   limit:{item:'crate',base:CRATE_BASE,per:CRATE_PER_VAULT,from:'vault'},
   unlock:['got:plank'],reveal:['got:workbench'],hint:'しまっておく物。置ける量が増える'},
  {id:'sawdust',out:{sawdust:3},inputs:{branch:5},station:['mill'],time:50,
   unlock:['got:mill'],reveal:['got:mill'],hint:'枝を挽くと出る細かい物'},
  {id:'grit',out:{sand:3},inputs:{stone:4},station:['mill'],time:70,
   unlock:['got:shovel'],reveal:['got:mill'],hint:'石を挽くと細かい粒になる'},
  {id:'dustcoal',out:{charcoal:1},inputs:{sawdust:6},station:['furnace'],time:80,
   unlock:['got:sawdust'],reveal:['got:sawdust'],hint:'木くずをまとめて蒸し焼きにする'},
  {id:'mill',out:{mill:1},inputs:{wheat:12,plank:6},station:['workbench'],
   unlock:['got:wheat'],reveal:['got:farm'],hint:'麦×12 と 板材×6'},
  {id:'flour',out:{flour:1},inputs:{wheat:4},station:['mill'],
   unlock:['got:mill'],reveal:['got:mill'],hint:'麦を挽いた物'},
  {id:'bread',out:{bread:1},inputs:{flour:3},station:['mill'],
   unlock:['got:flour'],reveal:['got:mill'],hint:'小麦粉を使う何か'},

  /* ---- Tier 2 ここから ---- */

const KEY='kuchibashi-craft-v3';
/* セーブの版。形を変えたら上げて、migrate に移行を書き足す。
   fresh に v を入れないのは、版を持たない古いセーブを
   Object.assign した時に「新しい版」と誤認しないため */
const SAVE_V=4;
const fresh=()=>({inv:{},flags:{},acc:{},plots:[],jobs:[],units:{},scale:1,tune:{},lastSeen:0});

/* セーブの形を今の版にそろえる。起動時と取り込み時の両方から通す */
function migrate(){
  if(!S||typeof S!=='object')S=fresh();
  if(!S.inv)S.inv={};
  if(!S.flags)S.flags={};
  if(!S.tune)S.tune={};
  if(!S.acc)S.acc={};
  /* v1 以前: 次に採れる時刻を ready{} で持ち、plots に収穫待ちが無かった */
  if(!S.v&&S.ready)delete S.ready;
  S.plots=(S.plots||[]).map(p=>p?{crop:CROPS[p.crop]?p.crop:'wheat',
    at:(+p.at||Date.now()),n:(+p.n||0)}:null);
  /* v2 以前: 複合工房を持っていた人には、食べた2つの設備を返す */
  if(S.inv&&S.inv.workshop){
    S.inv.workbench=(S.inv.workbench||0)+S.inv.workshop;
    S.inv.mill=(S.inv.mill||0)+S.inv.workshop;
    delete S.inv.workshop;
    S.flags['got:workbench']=1;S.flags['got:mill']=1;
  }
  /* 無くなったレシピや設備を指しているジョブは捨てる。
     残したまま描こうとすると画面ごと落ちるため */
  S.jobs=(S.jobs||[]).filter(j=>j&&ITEMS[j.station]&&RECIPES.some(r=>r.id===j.id));
  if(!S.units||typeof S.units!=='object')S.units={};
  /* v3 以前: ジョブがどの1台で動いているかを持っていなかった。
     同じ設備の中で空いている番号に順に割り当てる */
  S.jobs.forEach(j=>{
    if(j.u!==undefined)return;
    const taken=S.jobs.filter(x=>x.station===j.station&&x.u!==undefined).map(x=>x.u);
    let i=0;while(taken.indexOf(i)>=0)i++;
    j.u=i;
  });
  /* 時間倍率は開発用。保存された値をそのまま使うと、不在中の蓄積まで
     倍率ぶん進んでしまうため、起動時は必ず等倍に戻す */
  S.scale=1;
  S.v=SAVE_V;
}
let S=fresh();
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(fresh(),JSON.parse(r));}catch(e){}
migrate();
/* 不在時間。蓄積を進める前に測る */
const AWAY=Math.max(0,Date.now()-(S.lastSeen||Date.now()));
const save=()=>{try{S.lastSeen=Date.now();localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};
const tv=(k,def)=>{const v=S.tune[k];return(v===undefined||v===''||isNaN(v))?def:+v;};

/* ============================================================
   エンジン層 — ctx = {inv, flags, ...}。本体もシミュレーターも同じ
   ============================================================ */
const now=()=>Date.now();
const ms=sec=>sec*1000/S.scale;
const cnt=(c,id)=>c.inv[id]||0;

/* 調整値を土台に、持っている道具の補正を重ねた実効値 */
function eff(c,key,base,min){
  let v=tv(key,base),add=0,mul=1;
  for(const id in ITEMS){
    const it=ITEMS[id];
    if(!it.mods||cnt(c,id)<1)continue;
    it.mods.forEach(m=>{if(m.k!==key)return;
      if(m.mul!==undefined)mul*=m.mul;
      if(m.add!==undefined)add+=m.add;});
  }
  return Math.max(min===undefined?0:min,Math.round((v+add)*mul));
}
const cdOf=(c,n)=>eff(c,'cd.'+n.id,n.cd,1);
const capOf=n=>Math.max(1,Math.round(tv('cap.'+n.id,CAP_NODE)));
const plotCap=()=>Math.max(1,Math.round(tv('cap.plot',CAP_PLOT)));
const yldOf=(c,n)=>{const o={};for(const k in n.yield)
  o[k]=[eff(c,'y0.'+n.id,n.yield[k][0],0),eff(c,'y1.'+n.id,n.yield[k][1],0)];return o;};
const cropOf=k=>CROPS[k]||CROPS.wheat;
const growOf=(c,k)=>eff(c,'grow.'+(CROPS[k]?k:'wheat'),cropOf(k).grow,1);
const cropYield=(c,k)=>eff(c,'cy.'+(CROPS[k]?k:'wheat'),cropOf(k).yield,0);
const cropOpen=(c,k)=>cropOf(k).unlock==='start'||flagOk(c,cropOf(k).unlock);
/* 区画に入っている物を重ねた、その区画だけの値 */
const fertOf=p=>(p&&p.fert&&FERT[p.fert])?FERT[p.fert]:null;
const plotGrow=(p,k)=>{const f=fertOf(p);
  return Math.max(1,Math.round(growOf(S,k)*(f?f.grow:1)));};
const plotYield=(p,k)=>{const f=fertOf(p);
  return Math.max(0,cropYield(S,k)+(f?f.yield:0));};
const timeOf=(c,r)=>r.time?eff(c,'time.'+r.id,r.time,1):0;
/* 実際にその炉で焼いたときの秒数 */
const timeAt=(r,fid,i)=>Math.max(1,Math.round(timeOf(S,r)*unitMul(fid,i)));
const inputsOf=r=>{const o={};for(const k in r.inputs)o[k]=tv('in.'+r.id+'.'+k,r.inputs[k]);return o;};

function flagOk(c,f){
  if(f==='start')return true;
  if(f==='never')return false;
  const i=f.indexOf(':'),k=f.slice(0,i),v=f.slice(i+1);
  if(k==='got') return !!c.flags['got:'+v];
  if(k==='have')return cnt(c,v)>=1;
  /* min:<item>:<n> — n個以上持っていること。消費はしない */
  if(k==='min'){const j=v.lastIndexOf(':');
    return cnt(c,v.slice(0,j))>=(+v.slice(j+1)||1);}
  return false;
}

/* エリアが開いていて、かつ道具の条件も満たしているノードだけが採れる */
const areaOf=id=>AREAS.find(a=>a.id===id);
const areaOpen=(c,id)=>{const a=areaOf(id);
  return !a||a.unlock==='start'||flagOk(c,a.unlock);};
const nodeAvail=(c,n)=>areaOpen(c,n.area)&&(!n.requires||flagOk(c,n.requires));

/* --- 放置の蓄積。閉じている間の経過を、開いた時にまとめて精算する --- */
const nodeOpen=n=>nodeAvail(S,n);
function accNode(node){
  const a=S.acc[node.id]||(S.acc[node.id]={n:0,t:now()});
  /* まだ解禁していないノードはためない。解禁した時点から数え始める */
  if(!nodeOpen(node)){a.n=0;a.t=now();return a;}
  const step=ms(cdOf(S,node)),cap=capOf(node);
  if(step>0&&now()>a.t){
    const g=Math.floor((now()-a.t)/step);
    if(g>0){a.n=Math.min(cap,a.n+g);a.t+=g*step;}
  }
  if(a.n>=cap)a.t=now();   /* 満杯の間は時間を進めない */
  return a;
}
function accPlot(p){
  if(!p)return null;
  const step=ms(plotGrow(p,p.crop)),cap=plotCap();
  if(p.n===undefined)p.n=0;
  if(step>0&&now()>p.at){
    const g=Math.floor((now()-p.at)/step);
    if(g>0){p.n=Math.min(cap,p.n+g);p.at+=g*step;}
  }
  if(p.n>=cap)p.at=now();
  return p;
}
function accrueAll(){NODES.forEach(accNode);S.plots.forEach(accPlot);}
const allOk=(c,l)=>l.every(f=>flagOk(c,f));
const affordIn=(c,i)=>Object.keys(i).every(k=>cnt(c,k)>=i[k]);
/* 素材1種あたりの保管上限。収納箱を作ると増える */
/* caps を持つ物は、特定の種類（いまは食べ物）だけ上限を押し上げる */
const catBonus=(c,id)=>{
  const it=ITEMS[id];
  if(!it||!it.cat)return 0;
  let add=0;
  for(const k in ITEMS){
    const x=ITEMS[k];
    if(!x.caps||cnt(c,k)<1)continue;
    x.caps.forEach(cp=>{if(cp.cat===it.cat)add+=cp.add*cnt(c,k);});
  }
  return add;
};
const invCap=(c,id)=>Math.min(tv('cap.max',CAP_MAX),
  tv('cap.base',CAP_BASE)
  +cnt(c,'crate')*tv('cap.box',CAP_BOX)
  +cnt(c,'vault')*tv('cap.vault',CAP_VAULT)
  +(id?catBonus(c,id):0));
/* 建てられる数に上限があるレシピ（収納箱）。石蔵を建てると枠が開く */
const limitOk=(c,r)=>!r.limit||cnt(c,r.limit.item)<
  tv('limit.'+r.id+'.base',r.limit.base)+
  tv('limit.'+r.id+'.per',r.limit.per)*cnt(c,r.limit.from);
const limitOf=(c,r)=>!r.limit?0:
  tv('limit.'+r.id+'.base',r.limit.base)+
  tv('limit.'+r.id+'.per',r.limit.per)*cnt(c,r.limit.from);
const isCapped=id=>!!ITEMS[id]&&ITEMS[id].kind==='material';
const roomFor=(c,id)=>isCapped(id)?Math.max(0,invCap(c,id)-cnt(c,id)):Infinity;
/* 入りきる分だけ渡し、実際に入った数を返す */
function giveIn(c,id,n){
  if(n<=0)return 0;
  n=Math.min(n,roomFor(c,id));
  if(n<=0)return 0;
  c.inv[id]=cnt(c,id)+n;c.flags['got:'+id]=1;return n;
}
/* 産出が全部入るか。入らないなら受け取らせず、溢れて消えないようにする */
const outFits=(c,r)=>Object.keys(r.out).every(k=>r.out[k]<=roomFor(c,k));
const FULLMSG='📦 置き場がない。収納箱を作ると増える';
const stationFor=(c,r)=>r.station?(r.station.find(s=>cnt(c,s)>=1)||null):null;
const stationOk=(c,r)=>!r.station||!!stationFor(c,r);
const busyAt=(c,s)=>(c.jobs||[]).filter(j=>j.station===s).length;

/* --- 施設の個体。畑の区画と同じ考え方で、1台ずつ状態を持つ --- */
function syncUnits(fid){
  if(!S.units)S.units={};
  const want=Math.floor(count(fid));
  const a=S.units[fid]||(S.units[fid]=[]);
  while(a.length<want)a.push({up:{}});
  while(a.length>want)a.pop();
  return a;
}
const unitAt=(fid,i)=>{const a=(S.units&&S.units[fid])||[];return a[i];};
const hasUpg=(fid,i,k)=>{const u=unitAt(fid,i);return !!(u&&u.up&&u.up[k]);};
const unitMul=(fid,i)=>{let m=1;
  (UPG[fid]||[]).forEach(u=>{if(u.mul&&hasUpg(fid,i,u.k))m*=u.mul;});return m;};
const unitHot=(fid,i)=>(UPG[fid]||[]).some(u=>u.hot&&hasUpg(fid,i,u.k));
const unitBusy=(c,fid,i)=>(c.jobs||[]).some(j=>j.station===fid&&j.u===i);
/* 空いている1台を探す。高温が要る加工は、耐火レンガを積んだ炉だけ */
function freeUnit(fid,needHot){
  const n=Math.floor(count(fid));
  for(let i=0;i<n;i++){
    if(unitBusy(S,fid,i))continue;
    if(needHot&&!unitHot(fid,i))continue;
    return i;
  }
  return -1;
}
/* シミュレーターは理想プレイなので、持っていれば据え付けた扱いにする */
const ctxHot=(c,fid)=>{
  if(c!==S)return cnt(c,'firebrick')>=1;
  const n=Math.floor(count(fid));
  for(let i=0;i<n;i++)if(unitHot(fid,i))return true;
  return false;
};
function slotOk(c,r){
  if(!r.time)return true;
  const s=stationFor(c,r);
  if(!s)return false;
  if(r.hot&&!ctxHot(c,s))return false;
  if(c!==S)return busyAt(c,s)<cnt(c,s);
  return freeUnit(s,!!r.hot)>=0;
}
function installUpg(fid,i,k){
  const spec=(UPG[fid]||[]).find(x=>x.k===k);
  if(!spec)return;
  syncUnits(fid);
  const u=unitAt(fid,i);
  if(!u){toast('その設備がない');return;}
  if(u.up[k]){toast('もう据え付けてある');return;}
  if(count(spec.item)<1){toast(ITEMS[spec.item].name+'がない');return;}
  S.inv[spec.item]=count(spec.item)-1;
  u.up[k]=1;save();renderKeep();
  toast(ITEMS[spec.item].icon+' 据え付けた');
}

/* --- 本体 --- */
const count=id=>cnt(S,id);
const has=f=>flagOk(S,f);
const ok=l=>allOk(S,l);
function syncPlots(){
  const n=Math.floor(count('farm'));
  while(S.plots.length<n)S.plots.push(null);
  while(S.plots.length>n)S.plots.pop();
  S.plots.forEach(accPlot);
}
function gather(node){
  const a=accNode(node);
  if(a.n<1)return;
  const y=yldOf(S,node),tot={};
  let taken=0;
  for(let i=0;i<a.n;i++){
    /* この1回で出うる最大量が入らなければ、残りはノードに置いたままにする */
    let fits=true;
    for(const k in y)
      if((tot[k]||0)+Math.max(y[k][0],y[k][1])>roomFor(S,k))fits=false;
    if(!fits)break;
    for(const k in y){const[lo,hi]=y[k];
      tot[k]=(tot[k]||0)+lo+Math.floor(Math.random()*(Math.max(lo,hi)-lo+1));}
    taken++;
  }
  if(taken<1){toast(FULLMSG);return;}
  const got=[];
  for(const k in tot){const g=giveIn(S,k,tot[k]);
    if(g>0)got.push(ITEMS[k].icon+ITEMS[k].name+'×'+g);}
  a.n-=taken;a.t=now();
  toast(got.join(' / '));save();renderKeep();
}
function craft(r){
  const inp=inputsOf(r);
  if(!ok(r.unlock)||!stationOk(S,r)||!affordIn(S,inp)||!slotOk(S,r))return;
  if(!limitOk(S,r)){toast('これ以上は置けない。石蔵を建てると枠が増える');return;}
  if(!r.time&&!outFits(S,r)){toast(FULLMSG);return;}
  for(const k in inp)S.inv[k]=count(k)-inp[k];
  if(r.time){
    const st=stationFor(S,r);
    syncUnits(st);
    const u=freeUnit(st,!!r.hot);
    if(u<0){toast('空いている'+ITEMS[st].name+'がない');return;}
    const span=ms(timeAt(r,st,u));
    S.jobs.push({id:r.id,station:st,u:u,dur:span,done:now()+span});
    toast('🔥 投入した');
  }else{
    const names=[];
    for(const k in r.out){giveIn(S,k,r.out[k]);names.push(ITEMS[k].icon+ITEMS[k].name+'×'+r.out[k]);}
    const first=ITEMS[Object.keys(r.out)[0]];
    toast((first&&first.kind==='material'?'':'🎉 ')+names.join(' / '));
  }
  syncPlots();save();renderKeep();
}
function collect(i){
  const j=S.jobs[i];if(!j||now()<j.done)return;
  const r=RECIPES.find(x=>x.id===j.id),names=[];
  if(!r){S.jobs.splice(i,1);save();renderKeep();return;}
  if(!outFits(S,r)){toast(FULLMSG);return;}
  for(const k in r.out){giveIn(S,k,r.out[k]);names.push(ITEMS[k].icon+ITEMS[k].name+'×'+r.out[k]);}
  S.jobs.splice(i,1);toast(names.join(' / '));save();renderKeep();
}
/* 完成した物をまとめて受け取る。1台ずつ開かずに済ませるため */
function collectAll(fid){
  let got=0,blocked=false;
  for(let i=S.jobs.length-1;i>=0;i--){
    const j=S.jobs[i];
    if(j.station!==fid||now()<j.done)continue;
    const r=RECIPES.find(x=>x.id===j.id);
    if(!r){S.jobs.splice(i,1);continue;}
    if(!outFits(S,r)){blocked=true;continue;}
    for(const k in r.out)giveIn(S,k,r.out[k]);
    S.jobs.splice(i,1);got++;
  }
  toast(got?'受け取った ×'+got:(blocked?FULLMSG:'完成した物がない'));
  save();renderKeep();
}
/* 育った区画をまとめて収穫する */
function harvestAll(){
  let got=0;
  S.plots.forEach((p,i)=>{
    const q=accPlot(p);
    if(q&&q.n>0){harvest(i);got++;}
  });
  if(!got)toast('収穫できる区画がない');
}
function plant(i,k){if(!CROPS[k]||!cropOpen(S,k))return;
  /* 植え替えると、入れていた物は土ごと入れ替わる */
  S.plots[i]={crop:k,at:now(),n:0,fert:null};save();renderKeep();}
function applyFert(i,id){
  const p=S.plots[i];
  if(!p){toast('先に何か植える');return;}
  if(!FERT[id]||count(id)<1){toast('持っていない');return;}
  if(p.fert===id)return;
  S.inv[id]=count(id)-1;
  p.fert=id;save();renderKeep();
  toast(ITEMS[id].icon+' 入れた');
}
/* 植え替え。たまっている分は先に収穫しておく必要がある */
function replant(i,k){const p=S.plots[i];
  if(p&&p.n>0){toast('先に収穫してから');return;}
  plant(i,k);}
function harvest(i){const p=accPlot(S.plots[i]);if(!p||p.n<1)return;
  const k=CROPS[p.crop]?p.crop:'wheat';
  const per=Math.max(1,plotYield(p,k));
  const take=Math.min(p.n,Math.floor(roomFor(S,k)/per));
  if(take<1){toast(FULLMSG);return;}
  const n=giveIn(S,k,take*per);
  p.n-=take;p.at=now();toast(cropOf(k).icon+cropOf(k).name+'×'+n);save();renderKeep();}

/* ============================================================
   シミュレーター
   ============================================================ */
function simulate(maxSec=86400){
  const c={inv:{},flags:{},ready:{},plots:[],jobs:[],made:{},started:{}};
  const targets=RECIPES.filter(r=>!r.unlock.includes('never'));
  const log=[],actTicks=[];
  const pend=k=>c.jobs.reduce((s,j)=>{const r=RECIPES.find(x=>x.id===j.id);
    return s+((r&&r.out[k])||0);},0);
  /* 必要数。未達のレシピの材料をたどり、中間素材の需要も伝播させる。
     これが無いと vault <- レンガ <- 粘土 のような多段の連鎖で、
     途中の素材が「一度作ったから、もう要らない」と判定されて止まる */
  const requiredQty=()=>{const q={};
    const need=(k,v)=>{q[k]=Math.max(q[k]||0,v);};
    targets.forEach(r=>{if(c.made[r.id])return;
      const inp=inputsOf(r);
      for(const k in inp)need(k,inp[k]);
      r.unlock.forEach(f=>{if(f.indexOf('min:')!==0)return;
        const v=f.slice(4),j=v.lastIndexOf(':');
        need(v.slice(0,j),+v.slice(j+1)||1);});
      if(r.station&&!r.station.some(s=>cnt(c,s)>=1))need(r.station[0],1);});
    POLICY.forEach(p=>need(p.id,tv('policy.'+p.id,p.def)));
    for(let pass=0;pass<5;pass++){
      Object.keys(q).forEach(k=>{
        const short=q[k]-cnt(c,k)-pend(k);
        if(short<=0)return;
        const src=targets.find(r=>r.out[k]);     /* 採取物は作り方が無いので止まる */
        if(!src)return;
        const runs=Math.min(30,Math.ceil(short/src.out[k]));
        const inp=inputsOf(src);
        for(const j in inp)need(j,inp[j]*runs);
      });
    }
    return q;};

  let q=requiredQty(),qDirty=false;
  for(let t=0;t<=maxSec;t++){
    let acted=false;
    NODES.filter(n=>nodeAvail(c,n)).forEach(n=>{
      if(t>=(c.ready[n.id]||0)){const y=yldOf(c,n);
        for(const k in y)giveIn(c,k,(y[k][0]+y[k][1])/2);
        c.ready[n.id]=t+cdOf(c,n);acted=true;}});

    for(let i=c.jobs.length-1;i>=0;i--){
      if(t>=c.jobs[i].done){
        const r=RECIPES.find(x=>x.id===c.jobs[i].id);
        for(const k in r.out)giveIn(c,k,r.out[k]);
        c.made[r.id]=1;qDirty=true;
        if(!log.find(x=>x.id===r.id))log.push(entry(r,t));
        c.jobs.splice(i,1);acted=true;}}

    if(qDirty||t%15===0){q=requiredQty();qDirty=false;}
    const plots=Math.floor(cnt(c,'farm'));
    while(c.plots.length<plots)c.plots.push(null);
    /* 空き区画には、いま一番足りていない作物を植える */
    const pickCrop=()=>{
      const open=Object.keys(CROPS).filter(k=>cropOpen(c,k));
      if(!open.length)return 'wheat';
      let best=open[0],bestShort=-Infinity;
      open.forEach(k=>{
        const growing=c.plots.filter(x=>x&&x.crop===k).length*cropYield(c,k);
        const short=(q[k]||0)-cnt(c,k)-growing;
        if(short>bestShort){bestShort=short;best=k;}});
      return best;
    };
    c.plots.forEach((p,i)=>{
      if(!p)c.plots[i]={crop:pickCrop(),at:t};
      else if(t>=p.at+growOf(c,p.crop)){
        giveIn(c,p.crop,cropYield(c,p.crop));c.plots[i]=null;acted=true;}});
    for(const r of targets){
      if(!allOk(c,r.unlock)||!stationOk(c,r)||!slotOk(c,r)||!limitOk(c,r))continue;
      const inp=inputsOf(r);
      if(!affordIn(c,inp))continue;
      const outs=Object.keys(r.out);
      const want=(!c.made[r.id]&&!c.started[r.id])||
                 outs.some(k=>cnt(c,k)+pend(k)<(q[k]||0));
      if(!want)continue;
      for(const k in inp)c.inv[k]=cnt(c,k)-inp[k];
      c.started[r.id]=1;qDirty=true;
      if(r.time){c.jobs.push({id:r.id,station:stationFor(c,r),done:t+timeOf(c,r)});}
      else{for(const k in r.out)giveIn(c,k,r.out[k]);c.made[r.id]=1;
        if(!log.find(x=>x.id===r.id))log.push(entry(r,t));}
      acted=true;break;
    }
    if(acted)actTicks.push(t);
    if(log.length>=targets.length)break;
  }
  let maxGap=0,prev=0,longGaps=0;
  actTicks.forEach(t=>{const g=t-prev;if(g>maxGap)maxGap=g;if(g>120)longGaps++;prev=t;});
  return {log,maxGap,longGaps,done:log.length>=targets.length,
          total:log.length?log[log.length-1].t:0,missing:targets.length-log.length};
}
function entry(r,t){const k=Object.keys(r.out)[0],it=ITEMS[k];
  return {id:r.id,t:t,icon:it?it.icon:'❔',name:it?it.name:r.id};}

/* ============================================================
   表示層
   ============================================================ */
let tab='area',fac=null,area=null,facView='make',plotSel=null,unitSel=null,WELCOME=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const mmss=m=>{const s=Math.max(0,Math.ceil(m/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
const dur=sec=>sec<60?sec+'秒':(sec<3600?Math.round(sec/60)+'分':(sec/3600).toFixed(1)+'時間');
function toast(t){const d=document.createElement('div');d.textContent=t;
  $('toast').appendChild(d);setTimeout(()=>d.remove(),1900);}
const TAGS={station:'<span class="tag s">作業場</span>',tool:'<span class="tag t">道具</span>',
            plot:'<span class="tag s">区画</span>',storage:'<span class="tag s">収納</span>',
            villager:'<span class="tag t">住民</span>',
            material:''};
function costLine(i){return Object.keys(i).map(k=>{

  return '<span class="'+(have<need?'no':'')+'">'+ITEMS[k].icon+ITEMS[k].name+' '+have+'/'+need+'</span>';
}).join('　');}
/* min: 条件（消費しないが一定数いる物）の進み具合 */
function minLine(r){
  const ms=(r.unlock||[]).filter(f=>f.indexOf('min:')===0);
  if(!ms.length)return '';
  return '<div class="cost">'+ms.map(f=>{
    const v=f.slice(4),j=v.lastIndexOf(':');

  ).join('　')+'</div>';
}

function nodeCard(n){
  {
    const a=accNode(n),cap=capOf(n),step=ms(cdOf(S,n)),full=a.n>=cap;
    const left=full?0:Math.max(0,a.t+step-now());
    const pct=full?100:Math.max(0,Math.min(100,100-left/step*100));
    const base=tv('cd.'+n.id,n.cd),real=cdOf(S,n);
    return '<div class="card'+(a.n?' run':'')+'"><div class="row"><div class="ico">'+n.icon+'</div>'+
      '<div class="grow"><div class="name">'+n.name+
      (real<base?'<span class="tag t">短縮 '+real+'秒</span>':'')+
      (full?'<span class="tag s">満杯</span>':'')+'</div>'+
      '<div class="sub">'+n.desc+'</div></div>'+
      '<button onclick="gather(NODES.find(x=>x.id===\''+n.id+'\'))"'+(a.n<1?' disabled':'')+'>'+
      (a.n<1?mmss(left):'採取 ×'+a.n)+'</button></div>'+
      '<div class="bar"><i style="width:'+pct+'%"></i></div>'+
      '<div class="sub '+(full?'warn':'')+'" style="margin-top:6px">たまり '+a.n+' / '+cap+
      (full?'　満杯。採取するまで増えない':'　次まで '+mmss(left))+'</div></div>';
  }
}
const areaReady=a=>a.unlock==='start'||has(a.unlock);
function backBar(label,fn,icon,name){
  return '<div class="row" style="margin:2px 2px 10px">'+
    '<button class="ghost" onclick="'+fn+'">← '+label+'</button>'+
    '<div class="ico">'+icon+'</div>'+
    '<div class="grow"><div class="name">'+name+'</div></div></div>';
}
function viewArea(){
  /* エリアを選んでいるとき: そのエリアの採取先だけを出す */
  if(area){
    const a=areaOf(area);
    if(!a||!areaReady(a)){area=null;return viewArea();}
    const ns=NODES.filter(n=>n.area===a.id);
    const h=backBar('エリア','goArea(null)',a.icon,a.name);
    if(!ns.length)return h+'<div class="card sub">ここでは物を採らない。'+
      '持って行った物と引き換えに、手に入らない物をもらえる（施設タブの住民）。</div>';
    const vis=ns.filter(n=>!n.requires||has(n.requires));
    return h+(vis.length?vis.map(nodeCard).join('')
      :'<div class="card sub">ここで採れる物はまだ扱えない。道具がいる。</div>');
  }
  /* 一覧: どこに何がたまっているかが分かるようにする */
  return AREAS.map(a=>{
    if(!areaReady(a))
      return '<div class="card locked"><div class="row"><div class="ico">'+a.icon+'</div>'+
        '<div class="grow"><div class="name q">？？？</div>'+
        '<div class="hint">'+esc(a.hint)+'</div></div></div></div>';
    const ns=NODES.filter(n=>n.area===a.id);
    const vis=ns.filter(n=>!n.requires||has(n.requires));
    let stock=0,full=0;
    vis.forEach(n=>{const x=accNode(n);stock+=x.n;if(x.n>=capOf(n))full++;});
    return '<div class="card'+(stock?' run':'')+'" onclick="goArea(\''+a.id+'\')">'+
      '<div class="row"><div class="ico">'+a.icon+'</div>'+
      '<div class="grow"><div class="name">'+a.name+
      (stock?'<span class="tag t">たまり '+stock+'</span>':'')+
      (full?'<span class="tag s">満杯 '+full+'</span>':'')+'</div>'+
      '<div class="sub">'+(ns.length?vis.length+' / '+ns.length+' か所が使える'
                                    :'採取はできない場所')+'</div></div>'+
      '<div class="ico chev">›</div></div></div>';
  }).join('')+'<div class="sub" style="margin:4px 2px">道具を持つと、新しい採取先とエリアが現れる。'+
  '閉じている間も上限までたまる。</div>';
}

/* --- 1件ぶんの描画。施設画面から使い回す --- */
function jobCard(j,i){
  const r=RECIPES.find(x=>x.id===j.id);
  if(!r||!ITEMS[j.station])return '';
  const k=Object.keys(r.out)[0],it=ITEMS[k];
  const left=j.done-now(),done=left<=0;
  const unit=(j.u===undefined?'':(j.u+1)+'号　');
  const span=j.dur||ms(timeOf(S,r));
  const pct=done?100:Math.max(0,Math.min(100,100-left/span*100));
  return '<div class="card run"><div class="row"><div class="ico">'+ITEMS[j.station].icon+'</div>'+
    '<div class="grow"><div class="name">'+it.name+'</div>'+
    '<div class="sub">'+unit+ITEMS[j.station].name+upgLine(j.station,j.u)+
    '　'+(done?'完成':mmss(left))+'</div></div>'+
    '<button onclick="collect('+i+')"'+(done?'':' disabled')+'>'+
    (done?'受け取る':'加工中')+'</button></div>'+
    '<div class="bar gold"><i style="width:'+pct+'%"></i></div></div>';
}
/* 空いている加工の枠。jobCard と同じ構造にして高さを合わせる */
function upgLine(fid,i){
  const list=(UPG[fid]||[]).filter(u=>hasUpg(fid,i,u.k));
  return list.length?list.map(u=>ITEMS[u.item].icon).join(''):'';
}
function emptySlot(f,i){
  return '<div class="card"><div class="row">'+
    '<div class="ico" style="opacity:.3">'+f.icon+'</div>'+
    '<div class="grow"><div class="name q">'+(i+1)+'号　空き</div>'+
    '<div class="sub">'+(upgLine(f.id,i)||'下の一覧から投入できる')+'</div></div>'+
    '<button disabled>待機</button></div>'+
    '<div class="bar"><i style="width:0"></i></div></div>';
}
/* 設備を3列で並べる。畑の区画と同じ見え方に揃えてある */
function unitsGrid(f,slots){
  if(UPG[f.id])syncUnits(f.id);
  if(unitSel!==null&&unitSel<slots)return unitDetail(f,unitSel);
  const js=jobsAt(f.id);
  const ready=js.filter(x=>now()>=x.j.done).length;
  let h='<button class="alt" style="width:100%;margin-bottom:10px" '+
    'onclick="collectAll(\''+f.id+'\')"'+(ready?'':' disabled')+
    '>完成した物をまとめて受け取る（'+ready+'）</button>';
  h+='<div class="plots">';
  for(let i=0;i<slots;i++){
    const x=js.find(y=>y.j.u===i);
    const up=UPG[f.id]?upgLine(f.id,i):'';
    if(!x){
      h+='<div class="plot" onclick="goUnit('+i+')">'+
        '<div class="pi" style="opacity:.3">'+f.icon+'</div>'+
        '<div class="pt">'+(i+1)+'号　空き</div>'+
        '<div class="pf">'+(up||'—')+'</div></div>';
      continue;
    }
    const r=RECIPES.find(y=>y.id===x.j.id);
    const it=r?ITEMS[Object.keys(r.out)[0]]:null;
    const left=x.j.done-now(),fin=left<=0;
    h+='<div class="plot run" onclick="goUnit('+i+')">'+
      '<div class="pi">'+(it?it.icon:f.icon)+'</div>'+
      '<div class="pt'+(fin?' good':'')+'">'+(fin?'完成':mmss(left))+'</div>'+
      '<div class="pf">'+(i+1)+'号'+(up?' '+up:'')+'</div></div>';
  }
  return h+'</div><div class="sub" style="margin:8px 2px">'+
    (UPG[f.id]?'1台ずつタップすると、受け取りと据え付けができる。'
             :'1台ずつタップすると、中身を見られる。')+'</div>';
}
/* 設備1台ぶんの画面。受け取りと、据え付けをここでまとめて行う */
function unitDetail(f,i){
  const js=jobsAt(f.id),x=js.find(y=>y.j.u===i);
  let h='<div class="row" style="margin:2px 2px 10px">'+
    '<button class="ghost" onclick="goUnit(null)">← '+f.name+'</button>'+
    '<div class="ico">'+f.icon+'</div>'+
    '<div class="grow"><div class="name">'+(i+1)+'号</div></div></div>';
  h+=x?jobCard(x.j,x.i):emptySlot(f,i);
  if(UPG[f.id]){
    h+='<h2>据え付ける物</h2><div class="card">'+UPG[f.id].map(u=>{
      const has=hasUpg(f.id,i,u.k),have=Math.floor(count(u.item));
      return '<div class="row" style="padding:5px 0">'+
        '<div class="ico">'+ITEMS[u.item].icon+'</div>'+
        '<div class="grow"><div class="name">'+ITEMS[u.item].name+
        (has?'<span class="tag t">据え付け済み</span>':'')+'</div>'+
        '<div class="sub">'+u.note+'　所持 '+have+'</div></div>'+
        '<button class="alt" onclick="installUpg(\''+f.id+'\','+i+',\''+u.k+'\')"'+
        ((has||have<1)?' disabled':'')+'>据え付ける</button></div>';
    }).join('')+'<div class="sub" style="margin-top:6px">'+
    '据え付けた物はこの1台だけに効き、取り外しはできない。</div></div>';
  }
  return h;
}
function recipeCard(r){
  const inp=inputsOf(r),first=Object.keys(r.out)[0],it=ITEMS[first];
  const st=stationOk(S,r),slot=slotOk(S,r);
  const fits=!!r.time||outFits(S,r);
  const lim=limitOk(S,r);
  const can=st&&slot&&affordIn(S,inp)&&fits&&lim;
  const owned=first?Math.floor(count(first)):0,sx=stationFor(S,r);
  return '<div class="card"><div class="row"><div class="ico">'+(it?it.icon:'❔')+'</div>'+
    '<div class="grow"><div class="name">'+(it?it.name:'???')+
      (it?TAGS[it.kind]:'')+(owned?'<span class="tag">所持 '+owned+'</span>':'')+
      (r.time?'<span class="tag s">'+timeOf(S,r)+'秒</span>':'')+'</div>'+
    '<div class="cost">'+costLine(inp)+'</div>'+modLine(it)+
    (st?'':'<div class="need">'+r.station.map(x=>ITEMS[x].name).join(' か ')+' が必要</div>')+
    (st&&r.time?'<div class="slotline'+(slot?'':' no')+'">'+ITEMS[sx].name+
      ' 稼働 '+busyAt(S,sx)+' / '+Math.floor(count(sx))+'</div>':'')+
    (fits?'':'<div class="need">置き場がない。収納箱を作ると増える</div>')+
    (r.limit?'<div class="slotline'+(lim?'':' no')+'">置ける数 '+
      Math.floor(count(r.limit.item))+' / '+limitOf(S,r)+
      '（石蔵1つにつき +'+tv('limit.'+r.id+'.per',r.limit.per)+'）</div>':'')+
    '</div><button class="alt" onclick="craft(RECIPES.find(x=>x.id===\''+r.id+'\'))"'+
    (can?'':' disabled')+'>'+(r.time?'投入':'作る')+'</button></div></div>';
}

/* --- 施設 --- */
const HANDID='hand';
const FACKINDS=['station','plot','storage','villager'];
/* そこで何かを作る施設ではなく、持っているだけで効く物か */
const isPassive=k=>{
  const it=ITEMS[k];
  if(!it||!(it.mods||it.caps))return false;
  return !RECIPES.some(r=>r.station&&r.station.indexOf(k)>=0);
};
function facilities(){
  /* 素手でできる物の置き場。作業台を作る前はここしかない */
  const out=[{id:HANDID,name:'手仕事',icon:'🤲',count:1,kind:'hand'}];
  Object.keys(ITEMS).forEach(k=>{
    const it=ITEMS[k],c=Math.floor(count(k));
    if(c<1||FACKINDS.indexOf(it.kind)<0)return;
    /* 持っているだけで効く物は一覧では場所を取るだけなので、下にまとめる */
    if(isPassive(k))return;
    out.push({id:k,name:it.name,icon:it.icon,count:c,kind:it.kind});
  });
  return out;
}
function capsLine(it){
  if(!it||!it.caps)return '';
  const name={food:'食べ物'};
  return '<div class="mod">'+it.caps.map(c=>
    (name[c.cat]||c.cat)+'の置ける量 +'+c.add).join('　')+'</div>';
}
/* 持っているだけで効く物の一覧。道具もここにまとめて出す */
function passiveHtml(){
  const ks=Object.keys(ITEMS).filter(k=>count(k)>=1&&(ITEMS[k].mods||ITEMS[k].caps));
  if(!ks.length)return '';
  return '<div class="card"><div class="name">持っているだけで効く物</div>'+
    ks.map(k=>'<div style="margin-top:6px"><div class="sub">'+ITEMS[k].icon+' '+
      ITEMS[k].name+(count(k)>1?' ×'+Math.floor(count(k)):'')+'</div>'+
      modLine(ITEMS[k])+capsLine(ITEMS[k])+'</div>').join('')+'</div>';
}
const jobsAt=id=>S.jobs.map((j,i)=>({j:j,i:i}))
  .filter(x=>x.j.station===id&&RECIPES.some(r=>r.id===x.j.id));
/* その施設で扱えるレシピ。station が複数書いてあるレシピは、
   実際に使われる1つ（stationFor）の下にだけ出す */
function recipesAt(id){
  return RECIPES.filter(r=>{
    if(!ok(r.unlock))return false;
    if(!r.station)return id===HANDID;
    return stationOk(S,r)&&stationFor(S,r)===id;
  });
}
function facStatus(f){
  let t='';
  if(f.id==='farm'){
    let ready=0,empty=0;
    S.plots.forEach(p=>{if(!p){empty++;return;}
      const k=CROPS[p.crop]?p.crop:'wheat';ready+=(p.n||0)*cropYield(S,k);});
    if(ready)t+='<span class="tag t">収穫 '+ready+'</span>';
    if(empty)t+='<span class="tag s">空き '+empty+'</span>';
    return t;
  }
  const js=jobsAt(f.id);
  if(js.length){
    const d=js.filter(x=>now()>=x.j.done).length;
    if(d)t+='<span class="tag t">完成 '+d+'</span>';
    return t+'<span class="tag s">稼働 '+js.length+'/'+f.count+'</span>';
  }
  const n=recipesAt(f.id).filter(r=>
    affordIn(S,inputsOf(r))&&slotOk(S,r)&&(!!r.time||outFits(S,r))).length;
  return n?'<span class="tag s">作れる '+n+'</span>':'';
}
function facDesc(f){
  if(f.id==='farm')return '区画 '+S.plots.length;
  if(f.kind==='storage')return '置ける量 1個につき +'+
    (f.id==='vault'?tv('cap.vault',CAP_VAULT):tv('cap.box',CAP_BOX));
  if(f.kind==='villager')return '訪ねて、品を分けてもらう';
  const n=recipesAt(f.id).length;
  return n?n+' 種類を扱える':'持っているだけで効く';
}
function viewFac(){
  /* 施設を選んでいるとき */
  if(fac){
    const f=facilities().find(x=>x.id===fac);
    if(!f){fac=null;return viewFac();}
    let h=backBar('施設','goFac(null)',f.icon,
      f.name+(f.count>1?'<span class="tag s">×'+f.count+'</span>':''));
    if(f.id==='farm')return h+plotsHtml();
    if(f.kind==='storage')
      return h+'<div class="card sub">置ける量を増やす。いまの上限は素材1種あたり '+invCap(S)+
        '（収納箱 '+Math.floor(count('crate'))+'個 / 石蔵 '+
        Math.floor(count('vault'))+'個）。</div>';
    const js=jobsAt(f.id),rs=recipesAt(f.id);
    const it=ITEMS[f.id];
    /* 加工する施設は「作る」と「稼働」を別画面にする。
       同じ画面に積むと、枠のぶんレシピ一覧が下へ押し出され、
       設備が増えるほど毎回スクロールしないと投入できなくなる。
       画面を分ければ、どちらの一覧も必ず上から始まるので、
       連続して押しても狙った物の位置が動かない */
    if(rs.some(r=>r.time)||js.length){
      const slots=Math.max(f.count,js.length);
      const done=js.filter(x=>now()>=x.j.done).length;
      h+='<div class="subtabs">'+
        '<button class="'+(facView==='make'?'on':'')+'" onclick="goFacView(\'make\')">'+
          '作る'+(rs.length?' '+rs.length:'')+'</button>'+
        '<button class="'+(facView==='run'?'on':'')+'" onclick="goFacView(\'run\')">'+
          '稼働 '+js.length+' / '+slots+
          (done?'<span class="badge">'+done+'</span>':'')+'</button></div>';
      if(facView==='run')return h+unitsGrid(f,slots);
    }
    if(rs.length)h+=rs.map(recipeCard).join('');
    if(it&&it.mods)h+='<div class="card"><div class="name">効果</div>'+modLine(it)+'</div>';
    if(!rs.length&&!(it&&it.mods))
      h+='<div class="card sub">ここで扱える物はまだない。</div>';
    return h;
  }
  /* 一覧: どこで何が動いているかが一目で分かるようにする */
  return facilities().map(f=>
    '<div class="card'+(jobsAt(f.id).length?' run':'')+'" onclick="goFac(\''+f.id+'\')">'+
    '<div class="row"><div class="ico">'+f.icon+'</div>'+
    '<div class="grow"><div class="name">'+f.name+
    (f.count>1?'<span class="tag s">×'+f.count+'</span>':'')+facStatus(f)+'</div>'+
    '<div class="sub">'+facDesc(f)+'</div></div>'+
    '<div class="ico chev">›</div></div></div>').join('')+
    passiveHtml()+
    '<div class="sub" style="margin:4px 2px">同じ施設を増やすと、その数だけ加工を並べて走らせられる。'+
    '置ける量は素材1種あたり '+invCap(S)+'。</div>';
}

function plotsHtml(){
  syncPlots();
  if(!S.plots.length)return '<div class="card sub">畑がまだない。板材×4 と 石×3 で作れる。'+
    '畑を追加で作れば区画が増える。</div>';
  if(plotSel!==null&&plotSel<S.plots.length)return plotDetail(plotSel);
  const cap=plotCap();
  const ready=S.plots.filter(p=>p&&p.n>0).length;
  return '<button class="alt" style="width:100%;margin-bottom:10px" '+
    'onclick="harvestAll()"'+(ready?'':' disabled')+
    '>育った区画をまとめて収穫（'+ready+'）</button>'+
    '<div class="plots">'+S.plots.map((p,i)=>{
    if(!p)return '<div class="plot" onclick="goPlot('+i+')">'+
      '<div class="pi">🟫</div><div class="pt">空き</div><div class="pf">植える</div></div>';
    const k=CROPS[p.crop]?p.crop:'wheat',cr=CROPS[k];
    const step=ms(plotGrow(p,k));
    const full=p.n>=cap,left=full?0:Math.max(0,p.at+step-now());
    const f=fertOf(p);
    return '<div class="plot'+(p.n?' run':'')+'" onclick="goPlot('+i+')">'+
      '<div class="pi">'+(p.n?cr.icon:cr.seed)+'</div>'+
      '<div class="pt'+(full?' warn':'')+'">'+(p.n?p.n+' / '+cap+'回':mmss(left))+'</div>'+
      '<div class="pf">'+(f?ITEMS[p.fert].icon+' '+ITEMS[p.fert].name:'—')+'</div></div>';
  }).join('')+'</div><div class="sub" style="margin:8px 2px">'+
  '区画をタップすると、育てる物と入れる物を選べる。'+
  '収穫しなくても '+cap+'回分までたまり、一度植えれば植え直しはいらない。</div>';
}
/* 区画1つぶんの画面。ここで作物と肥料を決める */
function plotDetail(i){
  const p=S.plots[i],cap=plotCap();
  let h='<div class="row" style="margin:2px 2px 10px">'+
    '<button class="ghost" onclick="goPlot(null)">← 畑</button>'+
    '<div class="ico">🟩</div>'+
    '<div class="grow"><div class="name">区画 '+(i+1)+' / '+S.plots.length+'</div></div></div>';
  if(p){
    const k=CROPS[p.crop]?p.crop:'wheat',cr=CROPS[k];
    const step=ms(plotGrow(p,k)),full=p.n>=cap;
    const left=full?0:Math.max(0,p.at+step-now());
    const per=plotYield(p,k),f=fertOf(p);
    h+='<div class="card run"><div class="row"><div class="ico">'+(p.n?cr.icon:cr.seed)+'</div>'+
      '<div class="grow"><div class="name">'+cr.name+
      (f?'<span class="tag t">'+ITEMS[p.fert].name+'</span>':'')+'</div>'+
      '<div class="sub">'+dur(plotGrow(p,k))+'で'+per+'個　'+
      (full?'満杯':'次まで '+mmss(left))+'</div></div>'+
      '<button onclick="harvest('+i+')"'+(p.n?'':' disabled')+'>'+
      (p.n?'収穫 ×'+(p.n*per):'育成中')+'</button></div>'+
      '<div class="bar"><i style="width:'+(full?100:Math.max(0,Math.min(100,100-left/step*100)))+'%"></i></div>'+
      '<div class="sub" style="margin-top:6px">たまり '+p.n+' / '+cap+'</div></div>';
  }else h+='<div class="card sub">まだ何も植えていない。</div>';
  const open=Object.keys(CROPS).filter(x=>cropOpen(S,x));
  h+='<h2>育てる物</h2><div class="card">'+open.map(x=>
    '<div class="row" style="padding:5px 0"><div class="ico">'+CROPS[x].icon+'</div>'+
    '<div class="grow"><div class="name">'+CROPS[x].name+'</div>'+
    '<div class="sub">'+dur(growOf(S,x))+'で'+cropYield(S,x)+'個</div></div>'+
    '<button class="alt" onclick="replant('+i+',\''+x+'\')"'+
    (p&&p.crop===x?' disabled':'')+'>'+(p&&p.crop===x?'育成中':'植える')+'</button></div>'
  ).join('')+'</div>';
  h+='<h2>入れる物</h2><div class="card">'+Object.keys(FERT).map(x=>{
    const have=Math.floor(count(x)),on=!!p&&p.fert===x;
    return '<div class="row" style="padding:5px 0"><div class="ico">'+ITEMS[x].icon+'</div>'+
      '<div class="grow"><div class="name">'+ITEMS[x].name+
      (on?'<span class="tag t">入っている</span>':'')+'</div>'+
      '<div class="sub">'+FERT[x].note+'　所持 '+have+'</div></div>'+
      '<button class="alt" onclick="applyFert('+i+',\''+x+'\')"'+
      ((!p||on||have<1)?' disabled':'')+'>入れる</button></div>';
  }).join('')+'<div class="sub" style="margin-top:6px">'+
  '入れた物は、その区画を植え替えると土ごと入れ替わる。</div></div>';
  return h;
}

  h+='</div><div class="card"><h2 style="margin-top:0">作物</h2>';

       num('cy.'+k,cr.yield,'個')+'</div>';});
  h+='<div class="tr"><div class="tl">　└ 収穫待ちの上限（麦なら約'+
     dur(growOf(S,'wheat')*plotCap())+'で満杯）</div>'+
     num('cap.plot',CAP_PLOT,'回')+'</div></div>';

  h+='<div class="card"><h2 style="margin-top:0">加工時間</h2>';

    h+='<div class="tr"><div class="tl">'+it.icon+' '+it.name+'</div>'+num('time.'+r.id,r.time,'秒')+'</div>';});
  h+='</div><div class="card"><h2 style="margin-top:0">レシピ必要数</h2>';
  RECIPES.filter(r=>!r.unlock.includes('never')).forEach(r=>{
    const first=Object.keys(r.out)[0],it=ITEMS[first];
    h+='<div class="tr"><div class="tl">'+(it?it.icon+' '+it.name:r.id)+'</div>'+
      Object.keys(r.inputs).map(k=>num('in.'+r.id+'.'+k,r.inputs[k],ITEMS[k].icon)).join('')+'</div>';});
  h+='</div><div class="card"><h2 style="margin-top:0">収納</h2>'+
     '<div class="tr"><div class="tl">📦 初期の置ける量（素材1種あたり）</div>'+
     num('cap.base',CAP_BASE,'個')+'</div>'+
     '<div class="tr"><div class="tl">　└ 収納箱1つあたりの増加</div>'+
     num('cap.box',CAP_BOX,'個')+'</div>'+
     '<div class="tr"><div class="tl">　└ 石蔵1つあたりの増加</div>'+
     num('cap.vault',CAP_VAULT,'個')+'</div>'+
     '<div class="tr"><div class="tl">　└ ここで頭打ち</div>'+
     num('cap.max',CAP_MAX,'個')+'</div>'+
     '<div class="sub" style="margin-top:6px">いまの値 '+invCap(S)+
     '　収納箱 '+Math.floor(count('crate'))+'個　石蔵 '+
     Math.floor(count('vault'))+'個</div>';
  h+='</div><div class="card"><h2 style="margin-top:0">解禁の間隔</h2>';
  POLICY.forEach(p=>{h+='<div class="tr"><div class="tl">測定方針：'+ITEMS[p.id].name+'をいくつ建てるか</div>'+
    num('policy.'+p.id,p.def,'個')+'</div>';});
  h+='<div id="sim" class="sub" style="margin-top:10px">「測定」を押すと到達時間が出る。</div>'+
     '<div class="row" style="margin-top:12px;gap:8px">'+
     '<button class="alt" onclick="runSim()">測定</button>'+
     '<button class="ghost" onclick="copyTune()">数値をコピー</button>'+
     '<button class="ghost" onclick="resetTune()">既定値</button></div></div>';
  h+='<div class="card"><h2 style="margin-top:0">セーブ</h2>'+
     '<div class="sub">書き出した文字列を控えておけば、端末を変えても続きから遊べる。'+
     '読み込むと今の状態は上書きされるが、直前の状態は控えに残る。</div>'+
     '<textarea id="savebox" class="savebox" '+
     'placeholder="ここに貼り付けてから「読み込む」"></textarea>'+
     '<div class="row" style="gap:8px;margin-top:8px">'+
     '<button class="alt" onclick="exportSave()">書き出す</button>'+
     '<button class="ghost" onclick="importSave()">読み込む</button>'+
     '<button class="ghost" style="margin-left:auto" onclick="restoreBackup()">控えに戻す</button>'+
     '</div><div class="sub" style="margin-top:6px">セーブ版 '+(S.v||'?')+'</div></div>';
  return h;
}
function setTune(k,v){S.tune[k]=(v===''?undefined:+v);save();runSim();}
function resetTune(){S.tune={};save();render();}
/* 上書きの前に、直前の状態を別キーに逃がしておく */
function backupSave(){
  try{localStorage.setItem(KEY+'-backup',JSON.stringify(S));}catch(e){}
}
function exportSave(){
  const t=$('savebox');if(!t)return;
  t.value=JSON.stringify(S);
  try{t.focus();t.select();}catch(e){}
  try{navigator.clipboard.writeText(t.value)
    .then(()=>toast('コピーした'),()=>toast('枠の中を手でコピー'));}
  catch(e){toast('枠の中を手でコピー');}
}
function importSave(){
  const t=$('savebox');if(!t)return;
  const raw=(t.value||'').trim();
  if(!raw){toast('枠に貼り付けてから押す');return;}
  let d;
  try{d=JSON.parse(raw);}catch(e){toast('読み取れない文字列');return;}
  if(!d||typeof d!=='object'||!d.inv){toast('セーブデータに見えない');return;}
  backupSave();
  S=Object.assign(fresh(),d);
  migrate();save();
  tab='area';fac=null;area=null;WELCOME=null;render();
  toast('読み込んだ');
}
function restoreBackup(){
  let raw=null;
  try{raw=localStorage.getItem(KEY+'-backup');}catch(e){}
  if(!raw){toast('戻せる控えがない');return;}
  let d;try{d=JSON.parse(raw);}catch(e){toast('控えが壊れている');return;}
  S=Object.assign(fresh(),d);
  migrate();save();
  tab='area';fac=null;area=null;WELCOME=null;render();
  toast('直前の状態に戻した');
}
function copyTune(){try{navigator.clipboard.writeText(JSON.stringify(S.tune,null,2))
  .then(()=>toast('コピーした'),()=>toast('コピー不可'));}catch(e){toast('コピー不可');}}
function runSim(){
  const el=$('sim');if(!el)return;
  const r=simulate();let h='<div class="ladder">',prev=0;
  r.log.forEach(x=>{h+='<div><span class="lt">'+dur(x.t)+'</span><span class="ld">+'+
    dur(x.t-prev)+'</span><span>'+x.icon+' '+x.name+'</span></div>';prev=x.t;});
  h+='</div>';
  h+=r.done?'<div class="sub" style="margin-top:8px">全解禁：<b>'+dur(r.total)+'</b></div>'
           :'<div class="sub warn" style="margin-top:8px">24時間で到達しないレシピが '+r.missing+' 件。</div>';
  h+='<div class="sub '+(r.maxGap>600?'warn':(r.maxGap>240?'':'good'))+'">最長の手待ち：'+
     dur(r.maxGap)+'（2分超 '+r.longGaps+' 回）</div>'+
     '<div class="sub" style="color:#6f655a">※平均値・全操作を即実行する理想プレイでの計算</div>';
  el.innerHTML=h;
}
/* 不在中にたまった物をまとめて知らせる */
function buildWelcome(away){
  if(away<300000)return null;          /* 5分未満なら出さない */
  const rows=[];
  NODES.filter(nodeOpen).forEach(n=>{
    const a=accNode(n);if(a.n>0)rows.push(n.icon+n.name+'×'+a.n);});
  const crop={};
  S.plots.forEach(p=>{if(!p||!p.n)return;const k=CROPS[p.crop]?p.crop:'wheat';
    crop[k]=(crop[k]||0)+p.n*plotYield(p,k);});
  Object.keys(crop).forEach(k=>rows.push(CROPS[k].icon+CROPS[k].name+'×'+crop[k]));
  const dn=S.jobs.filter(j=>now()>=j.done).length;
  if(dn>0)rows.push('🔥加工×'+dn+'（完成）');
  return rows.length?{away:away,rows:rows}:null;
}
function dismissWelcome(){WELCOME=null;render();}
function welcomeHtml(){
  if(!WELCOME)return '';
  return '<div class="card run"><div class="row"><div class="ico">👋</div>'+
    '<div class="grow"><div class="name">おかえり</div><div class="sub">'+
    dur(Math.round(WELCOME.away/1000))+'ぶり。受け取れる物がたまっている。</div></div>'+
    '<button class="ghost" onclick="dismissWelcome()">閉じる</button></div>'+
    '<div class="sub" style="margin-top:8px">'+WELCOME.rows.join('　/　')+'</div></div>';
}

const TABS=[
  {id:'area', label:'エリア',icon:'🗺',view:viewArea},
  {id:'fac',  label:'施設',  icon:'🛠',view:viewFac},
  {id:'codex',label:'図鑑',  icon:'📖',view:viewCodex},
  {id:'tune', label:'調整',  icon:'🎚',view:viewTune},
];
function render(){
  syncPlots();
  const held=Object.keys(ITEMS).filter(k=>count(k)>0);
  $('inv').innerHTML=held.length
    ? held.map(k=>{const mat=ITEMS[k].kind==='material',c=Math.floor(count(k));
        const cap=invCap(S,k);
        /* 上限が近いときだけ分母を出す。普段は数字だけで読みやすく保つ */
        return '<div class="chip'+(mat?'':' st')+(mat&&c>=cap?' full':'')+'">'+
          ITEMS[k].icon+' <b>'+c+'</b>'+
          (mat&&c>=cap*0.8?'<span class="cp">/'+cap+'</span>':'')+'</div>';
      }).join('')
    : '<div class="empty">持ち物なし。採取から始める。</div>';
  $('view').innerHTML=(tab==='tune'?'':welcomeHtml())+TABS.find(x=>x.id===tab).view()+
    (tab==='tune'?'':'<div class="dev">開発用 時間倍率'+
      '<button class="ghost" onclick="setScale(1)">×1</button>'+
      '<button class="ghost" onclick="setScale(10)">×10</button>'+
      '<button class="ghost" onclick="setScale(60)">×60</button>'+
      '<span>現在 ×'+S.scale+'（起動時は×1）</span>'+
      '<button class="ghost" style="margin-left:auto" onclick="reset()">初期化</button></div>');
  $('nav').innerHTML=TABS.map(x=>'<button class="'+(x.id===tab?'on':'')+
    '" onclick="go(\''+x.id+'\')"><span class="nv">'+x.icon+'</span>'+x.label+'</button>').join('');
  if(tab==='tune')runSim();
}
/* 押した場所が動かないよう、描き直しの前後でスクロール位置を揃える。
   0.5秒ごとの自動描画では呼ばない（指で慣性スクロール中に
   位置を書き戻すと、スクロールが止まってしまうため） */
function renderKeep(){
  const y=window.scrollY||document.documentElement.scrollTop||0;
  render();
  const y2=window.scrollY||document.documentElement.scrollTop||0;
  if(y&&Math.abs(y2-y)>1)window.scrollTo(0,y);
}
function go(id){tab=id;fac=null;area=null;render();}
function goFac(id){fac=id;facView='make';plotSel=null;unitSel=null;render();}
function goPlot(i){plotSel=i;render();}
function goUnit(i){unitSel=i;render();}
function goFacView(v){facView=v;unitSel=null;render();}
function goArea(id){area=id;render();}
/* 倍率を変えても、すでに動いている加工や蓄積が置き去りにならないよう、
   残り時間と経過時間を比率で引き直す。これが無いと、通しで遊んで
   確かめるときに炉だけ元の速さのまま取り残される */
function setScale(n){
  const old=S.scale||1,t=now();
  if(n!==old){
    S.jobs.forEach(j=>{j.done=t+(j.done-t)*old/n;});
    Object.keys(S.acc).forEach(k=>{const a=S.acc[k];a.t=t+(a.t-t)*old/n;});
    S.plots.forEach(p=>{if(p)p.at=t-(t-p.at)*old/n;});
  }
  S.scale=n;save();render();
}
function reset(){
  backupSave();                       /* 消す前に、戻せるようにしておく */
  const t=S.tune;S=fresh();S.tune=t;migrate();save();
  tab='area';fac=null;area=null;render();
}
accrueAll();
WELCOME=buildWelcome(AWAY);
save();
render();
let tick=0;
setInterval(()=>{accrueAll();if(++tick%20===0)save();if(tab!=='tune')render();},500);
if('serviceWorker' in navigator){window.addEventListener('load',function(){try{navigator.serviceWorker.register('sw.js').catch(function(){});}catch(e){}});}
</script>
</body>
